name: Jibble sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full writes to Asana and Jibble; dry-run only prints"
        type: choice
        options: [full, dry-run]
        default: full

concurrency:
  group: jibble-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Only fetch the sync's own folder: the repo root holds files of 100 MB+.
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            /skills/jibble_sync/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync
        working-directory: skills/jibble_sync
        env:
          # The API keys live in Doppler alone and are fetched at run time (jibble_sync/cli.py: load_doppler),
          # masked in the log: Jibble from openclaw/prd, Asana (ASANA_SERVICE_KEY) from vps_hermes/prd.
          # One read-only Doppler service token per config (GitHub secret names on the right).
          # DOPPLER_TOKEN_LOCAL is the token for openclaw/prd. No personal token is used.
          DOPPLER_TOKEN_OPENCLAW: ${{ secrets.DOPPLER_TOKEN_LOCAL }}
          DOPPLER_TOKEN_VPS_HERMES: ${{ secrets.DOPPLER_TOKEN_VPS_HERMES }}
          MODE: ${{ github.event.inputs.mode || vars.JIBBLE_SYNC_MODE || 'full' }}
        run: |
          if [ "$MODE" = "dry-run" ]; then
            python -m jibble_sync run --dry-run
          else
            python -m jibble_sync run
          fi
