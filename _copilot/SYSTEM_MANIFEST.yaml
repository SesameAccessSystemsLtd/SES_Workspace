# ── Session history / build context ───────────────────────────────────────
# Load these when a new harness needs to understand what was built and why.
context_files:
  build_log:
    path: "SES_Workspace/memory/LOG_OF_PROGRESS.txt"
    description: "Chronological build log May–Jun 2026. All fixes, DB changes, architectural decisions."
    origin: ".openclaw/agents/personal_planner — migrated 2026-07-02"
  cli_sessions:
    path: "SES_Workspace/memory/cli_sessions/"
    description: "Claude Code CLI session records. Named YYYY-MM-DD_slug.md."

# ── Systems of record ──────────────────────────────────────────────────────
systems_of_record:
  tasks_projects:   asana
  stock_parts:      ops_db
  crm:              crm_db
  purchasing_email: ops_db
  bom_mrp:          golden_index_csv + asana
  knowledge_giles:  ses_brain_obsidian
  knowledge_shared: sesame_brain_sharepoint
  file_index:       ses_workspace_copilot_graph

# ── External integrations ──────────────────────────────────────────────────
integrations:
  asana:
    writer: sap_agent_only
    reader: any_agent_via_ops_db
    protocol: requests_queue_for_writes

  microsoft_graph:
    mailbox: purchasing@sesameaccess.com
    auth: msal_client_credentials
    secret_manager: doppler
    project: openclaw
    config: dev

  hubspot:
    writer: sad_scraper
    reader: crm_db

  doppler:
    project: openclaw
    config: dev
    managed_secrets: [PURCHASING_EMAIL_API_KEY, GEMINI_API_KEY, GEMINI_API_KEY_AGENTS]
