# SES_Workspace SYSTEM_MANIFEST.yaml
# Machine-readable registry of all agents, bots, and automations in the SAS platform.
# Hermes reads this at startup. Update when adding/retiring components.

manifest_version: "1.0"
updated: "2026-06-30"
updated_by: "giles"

# ── Harnesses ──────────────────────────────────────────────────────────────
harnesses:
  hermes:
    name: "Hermes"
    role: "Primary orchestration — cron scheduler, Telegram gateway, VPS always-on"
    status: active
    environment: local_windows   # migrate to: vps_linux
    config: "C:/Users/GilesHugo/AppData/Local/hermes"
    model_primary: deepseek-chat
    telegram_chat: "8551261362"
    workspace: "C:/Users/GilesHugo/SES_Workspace"
    notes: "Migration from OpenClaw in progress"

  openclaw:
    name: "OpenClaw"
    role: "Legacy multi-agent harness — retiring"
    status: retiring
    environment: local_windows
    config: "C:/Users/GilesHugo/.openclaw"
    model_primary: gemini-2.5-flash-lite
    gateway_port: 18789
    notes: "Running in parallel during Hermes migration. Shut down when all crons validated."

  sesame_ai:
    name: "Sesame AI (CoWork-OS)"
    role: "Fleet LAN harness — interactive GUI for all SAS employees"
    status: deploying
    environment: local_windows_fleet
    config: "C:/Users/GilesHugo/sesame-ai"
    model_primary: deepseek
    notes: "Champion package built. Employee deployment pending."

# ── Agents (OpenClaw) ──────────────────────────────────────────────────────
agents:
  sesal:
    name: "Commander Claw (SESAL)"
    harness: openclaw
    dir: ".openclaw/agents/main"
    role: "Orchestrator — read-only, delegates to other agents"
    telegram_bot_id: null   # uses default gateway bot
    status: active
    permissions: [read_workspace, read_db]
    dependencies: [ops_db, asana_mirror]

  sap:
    name: "SAP (asana_agent)"
    harness: openclaw
    dir: ".openclaw/agents/asana_agent"
    role: "Sole Asana writer — processes REQUESTS/ queue"
    telegram_bot_id: "8036334348"
    status: active
    permissions: [read_workspace, write_asana, write_ops_db, process_requests]
    dependencies: [ops_db, requests_queue]

  sad:
    name: "SAD (scraper)"
    harness: openclaw
    dir: ".openclaw/agents/scraper"
    role: "Data ingestion, HubSpot sync, DATAMAP writer"
    telegram_bot_id: "8480740272"
    status: active
    permissions: [read_workspace, write_crm_db, write_datamap]
    dependencies: [crm_db, hubspot_api]

  sam:
    name: "SAM (sesame_marketing)"
    harness: openclaw
    dir: ".openclaw/agents/sesame_marketing"
    role: "Marketing campaigns, CRM, lead pipeline"
    telegram_bot_id: "8610936540"
    status: active
    permissions: [read_workspace, write_crm_db]
    dependencies: [crm_db]

  forge:
    name: "Forge (dev_agent)"
    harness: openclaw
    dir: ".openclaw/agents/dev_agent"
    role: "Code builds, nightly audit at 23:00"
    telegram_bot_id: null
    status: active
    permissions: [read_workspace, read_skills, write_plans]
    dependencies: [skills_root]

  navigator:
    name: "Navigator (personal_planner)"
    harness: openclaw
    dir: ".openclaw/agents/personal_planner"
    role: "Personal tasks — isolated from main system"
    telegram_bot_id: "7799362695"
    status: active
    permissions: [read_workspace]
    dependencies: []

